<!DOCTYPE html>
<html lang="en">
<head>
    <title>Height and weight</title>
    <style>
        .box{
            height:45px;/*Used to specify the height and width of elements.Can use units like pixels(px).Influnces padding,border,and margin.Can utilize min-height,maz-height,min-width,and max-width to set restriction on dimensions.*/
