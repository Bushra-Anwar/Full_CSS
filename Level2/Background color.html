<!DOCTYPE html>
<html lang="en">
<head>
    <title>Background color</title>
    <style>
        #first{color:aqua;background-color:pink;}/*Sets the background color of an element.Utilized as background-color:color;Enhances the visual appeal and contrast of webpage elements.*/
        #second{color:aqua;background-color:yellow;}
        button{color:aqua;background-color:red;}
    </style>
</head>
<body>
    <div id="first">First</div>
    <div id="second">Second</div>
    <button>Touch Me</button>
</body>
</html>
