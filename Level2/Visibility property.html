<!DOCTYPE html>
<html lang="en">
<head>
    <title>Visibility Property</title>
    <style>
        .box{
            height:80px; width: 100px;
            
        }
        #box1{
            background-color:rgb(34, 2, 7); visibility: hidden;
        }
        #box2{
            background-color:blueviolet; visibility: visible;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">BOX 1</div><br>
    <div id="box2" class="box">BOX 2</div><br>
</body>
</html>
