<!DOCTYPE html>
<html lang="en">
<head>
    <title>Descendent Selector</title>
    <style>
        div p{/*Styles elements nasted within a specified element.Separate selectors with spaces.Allows styling based on the hierarchical structure of HTML.Facilities more targeted and specific styling of elements.*/
            color:green
        }
        p{color:pink;}
    </style>
</head>
<body>
    <div>
        <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Eaque, vel?
        </p>

</body>
</html>
