<!DOCTYPE html>
<html lang="en">
<head>
    <title>Id selector</title>
    <style>
    #first {/*Targets a specific element with a unique ID attribute.Uses the hash(#) symbol Each ID should be used once per page for uniqueness.Ideal for styling individual,distinct elements.*/
        color: blue;
        
    }
    #second {
        color:aqua;
    }
    </style>
</head>
<body>
    <div id="first">First Div</div>
    <div id="second">Second Div</div>
</body>
</html>
