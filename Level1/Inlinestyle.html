<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inline Styling</title>
</head>
<body>
    <h1 style="color :red;">Inline Styling</h1>
    <!--Apply styles directly to HTML elements using the style attribute.Ideal for single,unique style alterations.May lead to cluttered HTML if used extensively.Reduces the reusability of CSS rules in larger projects-->
    <p style="color:blue;">Paragraph is blue</p>
</body>
</html>
